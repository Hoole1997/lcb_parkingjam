<!DOCTYPE html>
<html>
<head><style>*{margin:0;padding:0}</style></head>
<body>
<canvas id="c" width="1024" height="1024"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d')
// 背景
const g = ctx.createLinearGradient(0, 0, 0, 1024)
g.addColorStop(0, '#2c3e50')
g.addColorStop(1, '#16202e')
ctx.fillStyle = g
ctx.fillRect(0, 0, 1024, 1024)
// 车位线
ctx.strokeStyle = 'rgba(255,255,255,0.35)'
ctx.lineWidth = 14
ctx.setLineDash([70, 45])
for (const x of [140, 512, 884]) {
  ctx.beginPath(); ctx.moveTo(x, 60); ctx.lineTo(x, 964); ctx.stroke()
}
ctx.setLineDash([])

function rr(x, y, w, h, r) {
  ctx.beginPath()
  ctx.moveTo(x + r, y)
  ctx.arcTo(x + w, y, x + w, y + h, r)
  ctx.arcTo(x + w, y + h, x, y + h, r)
  ctx.arcTo(x, y + h, x, y, r)
  ctx.arcTo(x, y, x + w, y, r)
  ctx.closePath()
}
// 车（竖直向上，居中）
const cx = 512, w = 460, h = 700, x = cx - w / 2, y = 165
// 阴影
rr(x + 20, y + 30, w, h, 110); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill()
// 车身
rr(x, y + 18, w, h, 110); ctx.fillStyle = '#a93226'; ctx.fill()
rr(x, y, w, h, 110); ctx.fillStyle = '#e74c3c'; ctx.fill()
// 车顶
rr(x + w * 0.16, y + h * 0.28, w * 0.68, h * 0.46, 80); ctx.fillStyle = '#f1948a'; ctx.fill()
// 挡风玻璃
rr(x + w * 0.20, y + h * 0.30, w * 0.60, h * 0.14, 45); ctx.fillStyle = '#aed6f1'; ctx.fill()
// 后窗
rr(x + w * 0.20, y + h * 0.62, w * 0.60, h * 0.09, 40); ctx.fillStyle = '#aed6f1'; ctx.fill()
// 车灯
ctx.fillStyle = '#fef9e7'
ctx.beginPath(); ctx.arc(x + w * 0.2, y + 46, 30, 0, 7); ctx.fill()
ctx.beginPath(); ctx.arc(x + w * 0.8, y + 46, 30, 0, 7); ctx.fill()
</script>
</body>
</html>
